<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn thi Trắc nghiệm - 40 Câu Ngẫu Nhiên</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .info-panel { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 20px; font-size: 18px; color: #e74c3c; }
        .question-block { margin-bottom: 25px; padding: 15px; border: 1px solid #e0e0e0; border-radius: 5px; background-color: #fafafa; }
        .question-text { font-weight: bold; margin-bottom: 10px; font-size: 16px; }
        .option { margin-bottom: 8px; display: block; cursor: pointer; padding: 5px; border-radius: 4px; }
        .option:hover { background-color: #e9ecef; }
        .option input { margin-right: 10px; }
        
        .correct-ans { color: #27ae60; font-weight: bold; }
        .wrong-ans { color: #c0392b; text-decoration: line-through; }
        .feedback { margin-top: 10px; padding: 10px; border-radius: 4px; display: none; font-weight: bold; }
        .feedback.correct { background-color: #d5f5e3; color: #27ae60; display: block; border-left: 4px solid #27ae60;}
        .feedback.wrong { background-color: #fadbd8; color: #c0392b; display: block; border-left: 4px solid #c0392b;}
        
        .btn-container { text-align: center; margin-top: 30px; }
        button { background-color: #3498db; color: #fff; border: none; padding: 12px 25px; font-size: 16px; border-radius: 5px; cursor: pointer; margin: 0 10px; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        #btn-restart { background-color: #27ae60; display: none; }
        #btn-restart:hover { background-color: #2ecc71; }
        #score-display { text-align: center; font-size: 24px; font-weight: bold; color: #2c3e50; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>Hệ thống Ôn Tập Chủ Nghĩa Xã Hội Khoa Học</h1>
    <div class="info-panel">
        <span id="session-info">Phiên làm việc mới (Dữ liệu ngoài)</span>
        <span id="question-count">0 / 40 Câu</span>
    </div>
    
    <div id="quiz-container"></div>
    <div id="score-display"></div>

    <div class="btn-container">
        <button id="btn-submit" onclick="submitQuiz()">Nộp Bài & Xem Kết Quả</button>
        <button id="btn-restart" onclick="startNewSession()">Bắt Đầu Phiên Mới (40 Câu Khác)</button>
    </div>
</div>

<!-- NÚT GỌI DỮ LIỆU TỪ FILE data.js BÊN NGOÀI -->
<script src="data.js"></script>

<script>
    let currentSessionQuestions = [];

    // Hàm xáo trộn (Fisher-Yates)
    function shuffleArray(array) {
        let shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    // Bắt đầu 1 phiên 40 câu
    function startNewSession() {
        if (typeof questionBank === 'undefined') {
            document.getElementById("quiz-container").innerHTML = "<h3 style='color:red;'>Lỗi: Không tìm thấy file data.js! Vui lòng đảm bảo file data.js nằm cùng thư mục với file HTML này.</h3>";
            document.getElementById("btn-submit").style.display = "none";
            return;
        }

        document.getElementById("btn-submit").style.display = "inline-block";
        document.getElementById("btn-restart").style.display = "none";
        document.getElementById("score-display").style.display = "none";
        document.getElementById("quiz-container").innerHTML = "";
        
        // Trộn tổng kho (khoảng 80 câu) và cắt đúng 40 câu
        let numQuestions = Math.min(40, questionBank.length);
        currentSessionQuestions = shuffleArray(questionBank).slice(0, numQuestions);
        
        document.getElementById("question-count").innerText = `Đang làm: ${numQuestions} Câu (Ngẫu nhiên)`;

        renderQuiz();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderQuiz() {
        const container = document.getElementById("quiz-container");
        
        currentSessionQuestions.forEach((qObj, index) => {
            let questionDiv = document.createElement("div");
            questionDiv.className = "question-block";
            questionDiv.id = `qblock-${index}`;
            
            // Xáo trộn vị trí đáp án (A, B, C, D)
            let indices = shuffleArray([0, 1, 2, 3]);
            
            let optionsHtml = "";
            indices.forEach(optIndex => {
                optionsHtml += `
                    <label class="option" id="label-${index}-${optIndex}">
                        <input type="radio" name="q${index}" value="${optIndex}">
                        ${qObj.options[optIndex]}
                    </label>
                `;
            });

            questionDiv.innerHTML = `
                <div class="question-text">Câu ${index + 1}: ${qObj.question}</div>
                ${optionsHtml}
                <div class="feedback" id="feedback-${index}"></div>
            `;
            container.appendChild(questionDiv);
        });
    }

    function submitQuiz() {
        let score = 0;
        let total = currentSessionQuestions.length;
        
        currentSessionQuestions.forEach((qObj, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            const blockDiv = document.getElementById(`qblock-${index}`);
            
            // Hiện đáp án đúng
            document.getElementById(`label-${index}-${qObj.answer}`).classList.add("correct-ans");

            if (selected) {
                const userAns = parseInt(selected.value);
                if (userAns === qObj.answer) {
                    score++;
                    feedbackDiv.innerText = "✓ Chính xác!";
                    feedbackDiv.className = "feedback correct";
                    blockDiv.style.borderColor = "#27ae60";
                } else {
                    document.getElementById(`label-${index}-${userAns}`).classList.add("wrong-ans");
                    feedbackDiv.innerText = `✗ Sai. Đáp án đúng là: ${qObj.options[qObj.answer]}`;
                    feedbackDiv.className = "feedback wrong";
                    blockDiv.style.borderColor = "#c0392b";
                }
            } else {
                feedbackDiv.innerText = `⚠ Bạn bỏ trống. Đáp án đúng là: ${qObj.options[qObj.answer]}`;
                feedbackDiv.className = "feedback wrong";
                blockDiv.style.borderColor = "#f39c12";
            }
            
            let radios = document.querySelectorAll(`input[name="q${index}"]`);
            radios.forEach(r => r.disabled = true);
        });

        const scoreDisplay = document.getElementById("score-display");
        scoreDisplay.innerText = `Kết quả: Bạn đúng ${score} / ${total} câu (${Math.round((score/total)*100)}%)`;
        scoreDisplay.style.display = "block";

        document.getElementById("btn-submit").style.display = "none";
        document.getElementById("btn-restart").style.display = "inline-block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = startNewSession;
</script>

</body>
</html>
